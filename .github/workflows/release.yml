name: Release

on:
  push:
    branches:
      - main
      - master

env:
  REGISTRY: ghcr.io
  GHCR_ORG: goingdark-social
  IMAGE_NAME: staliaswarden

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: NODE_ENV=test npm test

      - name: Read version from package.json
        id: version
        run: echo "value=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Check if tag already exists
        id: tag_check
        run: |
          if git ls-remote --tags origin "refs/tags/v${{ steps.version.outputs.value }}" | grep -q .; then
            echo "tag_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "tag_exists=false" >> "$GITHUB_OUTPUT"
          fi
          if gh release view "v${{ steps.version.outputs.value }}" &>/dev/null; then
            echo "release_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "release_exists=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create tag
        if: steps.tag_check.outputs.tag_exists == 'false'
        run: |
          git tag "v${{ steps.version.outputs.value }}"
          git push origin "v${{ steps.version.outputs.value }}"

      - name: Create GitHub Release
        if: steps.tag_check.outputs.release_exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="v${{ steps.version.outputs.value }}"
          SEMVER="${{ steps.version.outputs.value }}"

          # Extract this version's section from CHANGELOG.md.
          # Matches the heading for this version and stops at the next heading.
          ESCAPED="$(echo "$SEMVER" | sed 's/\./\\./g')"
          CHANGELOG_NOTES="$(awk \
            "/^## \[?${ESCAPED}\]?/{found=1; next} found && /^## /{exit} found{print}" \
            CHANGELOG.md 2>/dev/null | sed '/^[[:space:]]*$/{ N; /^\n$/d }' || true)"

          # Append GitHub's auto-generated commit list so the release always
          # shows what merged, even when CHANGELOG has no entry yet.
          AUTO_NOTES="$(gh api "/repos/${{ github.repository }}/releases/generate-notes" \
            --method POST \
            --field tag_name="$VERSION" \
            --jq '.body' 2>/dev/null || echo '')"

          if [ -n "$CHANGELOG_NOTES" ]; then
            FULL_NOTES="$(printf '%s\n\n---\n\n%s' "$CHANGELOG_NOTES" "$AUTO_NOTES")"
          else
            FULL_NOTES="$AUTO_NOTES"
          fi

          gh release create "$VERSION" \
            --title "$VERSION" \
            --notes "$FULL_NOTES"

      - name: Set up Docker Buildx
        if: steps.tag_check.outputs.release_exists == 'false'
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: steps.tag_check.outputs.release_exists == 'false'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ env.GHCR_ORG }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        if: steps.tag_check.outputs.release_exists == 'false'
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.GHCR_ORG }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}},value=${{ steps.version.outputs.value }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.version.outputs.value }}
            type=semver,pattern={{major}},value=${{ steps.version.outputs.value }}
            type=raw,value=latest

      - name: Build and push versioned Docker image
        if: steps.tag_check.outputs.release_exists == 'false'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update release with Docker image tags
        if: steps.tag_check.outputs.release_exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="v${{ steps.version.outputs.value }}"
          SEMVER="${{ steps.version.outputs.value }}"
          IMAGE="${{ env.REGISTRY }}/${{ env.GHCR_ORG }}/${{ env.IMAGE_NAME }}"
          gh release edit "$VERSION" --notes-file - <<EOF
          $(gh release view "$VERSION" --json body --jq '.body')

          ---

          **Docker image**
          \`\`\`
          docker pull ${IMAGE}:${SEMVER}
          docker pull ${IMAGE}:latest
          \`\`\`
          EOF
